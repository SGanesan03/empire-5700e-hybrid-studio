name: Deploy Empire 5700-E Studio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      # Automatic-ah unga GitHub repository name-ah --base-href-la eduthukum
      - run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"
      # dist/ kulla irukura actual browser folder-ah automatic-ah kandupudichu upload pannum
      - name: Locate Angular browser output folder
        id: find_dist
        run: |
          BROWSER_DIR=$(find dist -maxdepth 3 -type d -name "browser" | head -n 1)
          echo "Detected output path: $BROWSER_DIR"
          echo "path=$BROWSER_DIR" >> $GITHUB_OUTPUT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dist.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
